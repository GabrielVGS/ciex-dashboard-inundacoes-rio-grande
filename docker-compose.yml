services:
  dashboard:
    build:
      context: .
      args:
        # Vazio por padrão: cenários hipotéticos ficam ocultos em produção.
        NEXT_PUBLIC_CENARIOS_HIPOTETICOS: ${NEXT_PUBLIC_CENARIOS_HIPOTETICOS:-}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-inundacoes.rule=Host(`${DASHBOARD_HOST:-inundacoes}.${DOMAIN:-ciex.local}`) || HostRegexp(`^inundacoes\\..+\\.sslip\\.io$$`)"
      - "traefik.http.routers.dashboard-inundacoes.tls=true"
      - "traefik.http.routers.dashboard-inundacoes.middlewares=security-headers@file,compress@file"
      - "traefik.http.services.dashboard-inundacoes.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
